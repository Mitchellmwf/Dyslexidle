<!DOCTYPE html>
<html>
<head>
    <title>DYSLEXILE</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

</head>
<body>
    <div id="popupWindow">
        <h2>Play with hint keyboard?</h2>
        <span>
            <button id="enableHintKeyboard" class="popupButton">Yes</button>
            <button id="disableHintKeyboard" class="popupButton">No</button>
        </span>
    </div>
    <div id="gameWindow" style="display: none;">
        <h1 id="title">DYSLEXILE</h1>
        <h3>Wordle but the letters are out of place</h3>
        <span id="letters">
            <div id="word"></div>
            <div id="prevGuesses" style="display: none !important;"></div>
            <div id="inputDiv"></div>
        </span>
        <br>
        <script src="script2.js"></script>
    </div>
</body>
</html>
