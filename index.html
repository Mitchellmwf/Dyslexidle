<!DOCTYPE html>
<html>
<head>
    <title>DYSLEXLE</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <script defer src="script2.js"></script>

</head>
<body>
    <div id="settingsWindow" class="popupWindow">
        <h2>Play with hint keyboard?</h2>
        <span>
            <button id="enableHintKeyboard" class="popupButton">Yes</button>
            <button id="disableHintKeyboard" class="popupButton">No</button>
            <button id="enableNormalKeyboard" class="popupButton">Normal Keyboard</button>
        </span>
        <p>Remembers which keys have been discovered.</p>
    </div>
    <div id="winWindow" class="popupWindow" style="display: none;">
        <span>
            <h2>You Win!</h2>
            <div>
                <button id="playAgainWin" class="popupButton">Play Again</button> 
                <button id="reset" class="popupButton" style="display: none;">Reset keyboard</button>
            </div>
        </span>
    </div>
    <div id="invalidWordWindow" class="popdownWindow" style="display: none;">
        <h2 id="invalidReason">Error!</h2>
    </div>
    <div id="gameWindow" style="display: none;">
        <h1 id="title">DYSLEXLE</h1>
        <h3>Wordle but the letters are out of place</h3>
        <span id="letters">
            <div id="prevGuesses" style="display: none !important;"></div>
            <div id="inputDiv" class="letterBoxRow"></div>
        </span>
        <br>
    </div>

</body>
</html>
